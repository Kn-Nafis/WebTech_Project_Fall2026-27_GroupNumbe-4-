<!DOCTYPE html>
<html>
<head>
<title>Login - LearnMate</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/toma.css">
</head>
 
<body class="auth-body">
 
    <div class="auth-layout">
 
        <div class="auth-image">
<img src="asset/login-learning.jpg" alt="Student learning with laptop">
 
            <div class="image-text">
<h2>Welcome Back to LearnMate</h2>
<p>Continue your learning journey and achieve your goals.</p>
</div>
</div>
 
        <div class="auth-card">
 
            <a href="../index.html" class="auth-logo">LearnMate.</a>
 
            <h1>Welcome Back!</h1>
<p class="form-description">Login to continue learning.</p>
 
            <form id="loginForm">
 
                <label for="loginEmail">Email Address</label>
<input type="email" id="loginEmail" name="email"
                       placeholder="Enter your email" required>
 
                <label for="loginPassword">Password</label>
<input type="password" id="loginPassword" name="password"
                       placeholder="Enter your password" required>
 
                <div class="form-options">
 
                    <label class="remember-label">
<input type="checkbox" id="rememberMe">
                        Remember me
</label>
 
                    <a href="forgot-password.html">Forgot password?</a>
 
                </div>
 
                <button type="submit" class="main-button">Login</button>
 
                <p id="loginMessage" class="form-message"></p>
 
            </form>
 
            <p class="bottom-text">
                Don't have an account?
<a href="register.html">Create Account</a>
</p>
 
        </div>
 
    </div>
 
    <script src="js/toma.js"></script>
<script src="js/auth.js"></script>
 
</body>
</html>
