<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - LearnMate</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/toma.css">
</head>

<body class="auth-body">

    <div class="auth-layout">

        <div class="auth-image">
            <img src="asset/auth-background.jpg" alt="Study desk">

            <div class="image-text">
                <h2>Keep Learning with LearnMate</h2>
                <p>Recover your account and continue where you left off.</p>
            </div>
        </div>

        <div class="auth-card">

            <a href="../index.html" class="auth-logo">LearnMate.</a>

            <h1>Forgot Password?</h1>

            <p class="form-description">
                Enter your email address to continue the password recovery demo.
            </p>

            <form id="forgotForm">

                <label for="forgotEmail">Email Address</label>

                <input type="email" id="forgotEmail"
                       placeholder="Enter your registered email" required>

                <button type="submit" class="main-button">
                    Continue
                </button>

                <p id="forgotMessage" class="form-message"></p>

            </form>

            <p class="bottom-text">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </p>

        </div>

    </div>

    <script src="js/toma.js"></script>

</body>
</html>
