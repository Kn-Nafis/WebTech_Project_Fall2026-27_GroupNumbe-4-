<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - LearnMate</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/toma.css">
</head>

<body class="auth-body">

    <div class="auth-layout">

        <div class="auth-image">
            <img src="asset/auth-background.jpg" alt="Study desk">

            <div class="image-text">
                <h2>Your Learning Journey Continues</h2>
                <p>Set a new password and get back to learning.</p>
            </div>
        </div>

        <div class="auth-card">

            <a href="../index.html" class="auth-logo">LearnMate.</a>

            <h1>Reset Password</h1>

            <p class="form-description">
                Enter and confirm your new password.
            </p>

            <form id="resetForm">

                <label for="newPassword">New Password</label>

                <input type="password" id="newPassword"
                       placeholder="Enter new password" required>

                <label for="repeatPassword">Confirm New Password</label>

                <input type="password" id="repeatPassword"
                       placeholder="Confirm new password" required>

                <button type="submit" class="main-button">
                    Reset Password
                </button>

                <p id="resetMessage" class="form-message"></p>

            </form>

            <p class="bottom-text">
                <a href="login.html">Back to Login</a>
            </p>

        </div>

    </div>

    <script src="js/toma.js"></script>

</body>
</html>
