<!DOCTYPE html>
<html>
<head>
    <title>Review Management - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Review Management</h1>
                <p>Review feedback submitted by students.</p>
            </div>

            <div class="card">
                <h2>Student Reviews</h2>
                <input class="search-box" type="text" placeholder="Search reviews...">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Student</th><th>Tutor</th><th>Rating</th><th>Review</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>
                            <tr><td>Demo Student</td><td>Demo Tutor</td><td>5/5</td><td>Example review text</td><td><span class="status approved">Visible</span></td><td><button class="btn btn-danger" data-action="Hide review">Hide</button></td></tr>
                            <tr><td>Demo Student 2</td><td>Demo Tutor 2</td><td>4/5</td><td>Example review text</td><td><span class="status pending">Under review</span></td><td><button class="btn" data-action="Approve review">Approve</button></td></tr>
                        </tbody>
                    </table>
                </div>
                <span class="demo-label">Example reviews.</span>
            </div>
        </main>
    </div>
</div>
</body>
</html>
