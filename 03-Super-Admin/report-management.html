<!DOCTYPE html>
<html>
<head>
    <title>Report Management - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Report Management</h1>
                <p>View platform reports and analytics.</p>
            </div>

            <div class="card">
                <img class="content-image" src="asset/reports-analytics.png" alt="Reports and analytics illustration">
                <h2>Platform Reports</h2>
                <p>Reports will be generated from actual platform data after backend integration.</p>
                <div class="stats-grid">
                    <div class="stat-card"><p>User Report</p><h2>--</h2></div>
                    <div class="stat-card"><p>Booking Report</p><h2>--</h2></div>
                    <div class="stat-card"><p>Payment Report</p><h2>--</h2></div>
                    <div class="stat-card"><p>Course Report</p><h2>--</h2></div>
                </div>
                <button class="btn" data-action="Generate platform report">Generate Report</button>
            </div>
        </main>
    </div>
</div>
</body>
</html>
