<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Edit Profile</h1>
                <p>Update your administrator information.</p>
            </div>

            <div class="card">
                <form class="demo-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" value="Administrator" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" value="admin@example.com" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" placeholder="Enter phone number">
                        </div>
                        <div class="form-group">
                            <label>Job Title</label>
                            <input type="text" value="Super Admin">
                        </div>
                    </div>
                    <button class="btn" type="submit">Save Changes</button>
                    <a class="btn btn-secondary" href="profile.html">Cancel</a>
                    <p class="message"></p>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
