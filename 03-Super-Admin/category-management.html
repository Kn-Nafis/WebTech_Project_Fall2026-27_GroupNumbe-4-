<!DOCTYPE html>
<html>
<head>
    <title>Category Management - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Category Management</h1>
                <p>Create and manage learning categories.</p>
            </div>

            <div class="card">
                <h2>Add New Category</h2>
                <form class="demo-form">
                    <div class="form-group">
                        <label>Category Name</label>
                        <input type="text" placeholder="Enter category name" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea placeholder="Enter category description"></textarea>
                    </div>
                    <button class="btn" type="submit">Add Category</button>
                    <p class="message"></p>
                </form>
            </div>

            <div class="card">
                <h2>Existing Categories</h2>
                <input class="search-box" type="text" placeholder="Search categories...">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Category</th><th>Description</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>
                            <tr><td>Mathematics</td><td>Math learning courses</td><td><span class="status approved">Active</span></td><td><button class="btn" data-action="Edit category">Edit</button></td></tr>
                            <tr><td>Science</td><td>Science learning courses</td><td><span class="status approved">Active</span></td><td><button class="btn" data-action="Edit category">Edit</button></td></tr>
                            <tr><td>Language</td><td>Language learning courses</td><td><span class="status approved">Active</span></td><td><button class="btn" data-action="Edit category">Edit</button></td></tr>
                        </tbody>
                    </table>
                </div>
                <span class="demo-label">Example categories.</span>
            </div>
        </main>
    </div>
</div>
</body>
</html>
