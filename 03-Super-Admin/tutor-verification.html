<!DOCTYPE html>
<html>
<head>
    <title>Tutor Verification - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Tutor Verification</h1>
                <p>Review tutor applications and verification status.</p>
            </div>

            <div class="card">
                <img class="content-image" src="asset/tutor-verification.png" alt="Tutor verification illustration">
                <input class="search-box" type="text" placeholder="Search applications...">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Tutor</th><th>Email</th><th>Document</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>
                            <tr><td>Demo Tutor One</td><td>tutor1@example.com</td><td>Sample document</td><td><span class="status pending">Pending</span></td><td><a class="btn" href="tutor-details.html">Review</a></td></tr>
                            <tr><td>Demo Tutor Two</td><td>tutor2@example.com</td><td>Sample document</td><td><span class="status pending">Pending</span></td><td><a class="btn" href="tutor-details.html">Review</a></td></tr>
                        </tbody>
                    </table>
                </div>
                <span class="demo-label">Example applications only. No real documents are attached.</span>
            </div>
        </main>
    </div>
</div>
</body>
</html>
