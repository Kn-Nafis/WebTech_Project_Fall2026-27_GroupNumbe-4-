<!DOCTYPE html>
<html>
<head>
    <title>Booking Management - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Booking Management</h1>
                <p>Monitor and manage student tutor bookings.</p>
            </div>

            <div class="card">
                <h2>Booking Records</h2>
                <input class="search-box" type="text" placeholder="Search bookings...">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Booking ID</th><th>Student</th><th>Tutor</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>
                            <tr><td>BK-DEMO-001</td><td>Demo Student</td><td>Demo Tutor</td><td>Not scheduled</td><td><span class="status pending">Pending</span></td><td><button class="btn" data-action="View booking">View</button></td></tr>
                            <tr><td>BK-DEMO-002</td><td>Demo Student 2</td><td>Demo Tutor 2</td><td>Not scheduled</td><td><span class="status approved">Confirmed</span></td><td><button class="btn" data-action="View booking">View</button></td></tr>
                        </tbody>
                    </table>
                </div>
                <span class="demo-label">Example booking records.</span>
            </div>
        </main>
    </div>
</div>
</body>
</html>
