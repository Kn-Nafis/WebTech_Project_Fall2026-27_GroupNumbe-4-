<!DOCTYPE html>
<html>
<head>
    <title>Course Management - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Course Management</h1>
                <p>Manage courses published on LearnMate.</p>
            </div>

            <div class="card">
                <img class="content-image" src="asset/course-management.png" alt="Course management illustration">
                <h2>Course List</h2>
                <input class="search-box" type="text" placeholder="Search courses...">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Course</th><th>Tutor</th><th>Category</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>
                            <tr><td>Demo Mathematics</td><td>Demo Tutor</td><td>Mathematics</td><td><span class="status approved">Published</span></td><td><button class="btn" data-action="View course">View</button></td></tr>
                            <tr><td>Demo English</td><td>Demo Tutor</td><td>Language</td><td><span class="status pending">Pending</span></td><td><button class="btn" data-action="Review course">Review</button></td></tr>
                        </tbody>
                    </table>
                </div>
                <span class="demo-label">Example course records.</span>
            </div>
        </main>
    </div>
</div>
</body>
</html>
