<!DOCTYPE html>
<html>
<head>
    <title>Admin Profile - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>My Profile</h1>
                <p>View your administrator account information.</p>
            </div>

            <div class="card">
                <div class="profile-box">
                    <div class="profile-avatar">A</div>
                    <div>
                        <h2>Administrator</h2>
                        <p>Super Admin</p>
                        <span class="status approved">Active</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Personal Information</h2>
                <div class="info-row"><span>Full Name</span><strong>Administrator</strong></div>
                <div class="info-row"><span>Email</span><strong>admin@example.com</strong></div>
                <div class="info-row"><span>Phone</span><strong>Not provided</strong></div>
                <div class="info-row"><span>Role</span><strong>Super Admin</strong></div>
                <div class="info-row"><span>Account Status</span><strong>Active</strong></div>
                <br>
                <a class="btn" href="edit-profile.html">Edit Profile</a>
            </div>
        </main>
    </div>
</div>
</body>
</html>
