<!DOCTYPE html>
<html>
<head>
    <title>Tutor Details - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Tutor Details</h1>
                <p>Review tutor profile and application information.</p>
            </div>

            <div class="card">
                <div class="profile-box">
                    <div class="profile-avatar">T</div>
                    <div><h2>Demo Tutor</h2><p>Mathematics Tutor</p><span class="status pending">Verification Pending</span></div>
                </div>
            </div>

            <div class="card">
                <h2>Application Information</h2>
                <div class="info-row"><span>Name</span><strong>Demo Tutor</strong></div>
                <div class="info-row"><span>Email</span><strong>tutor@example.com</strong></div>
                <div class="info-row"><span>Subject</span><strong>Mathematics</strong></div>
                <div class="info-row"><span>Experience</span><strong>Not provided</strong></div>
                <div class="info-row"><span>Documents</span><strong>No real file attached</strong></div>
                <br>
                <button class="btn" data-action="Approve tutor application">Approve</button>
                <button class="btn btn-danger" data-action="Reject tutor application">Reject</button>
                <a class="btn btn-secondary" href="tutor-verification.html">Back</a>
            </div>
        </main>
    </div>
</div>
</body>
</html>
