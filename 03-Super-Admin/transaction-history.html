<!DOCTYPE html>
<html>
<head>
    <title>Transaction History - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Transaction History</h1>
                <p>Review previous platform transactions.</p>
            </div>

            <div class="card">
                <h2>All Transactions</h2>
                <input class="search-box" type="text" placeholder="Search transactions...">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Transaction ID</th><th>Date</th><th>User</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead>
                        <tbody>
                            <tr><td>TR-DEMO-001</td><td>Demo date</td><td>Demo Student</td><td>Payment</td><td>Sample amount</td><td><span class="status approved">Completed</span></td></tr>
                            <tr><td>TR-DEMO-002</td><td>Demo date</td><td>Demo Tutor</td><td>Payout</td><td>Sample amount</td><td><span class="status pending">Pending</span></td></tr>
                        </tbody>
                    </table>
                </div>
                <span class="demo-label">Example transaction records. No real financial data is shown.</span>
            </div>
        </main>
    </div>
</div>
</body>
</html>
