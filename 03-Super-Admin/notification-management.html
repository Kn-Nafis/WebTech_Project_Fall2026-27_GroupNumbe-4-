<!DOCTYPE html>
<html>
<head>
    <title>Notification Management - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Notification Management</h1>
                <p>Create and manage platform notifications.</p>
            </div>

            <div class="card">
                <h2>Create Notification</h2>
                <form class="demo-form">
                    <div class="form-group">
                        <label>Notification Title</label>
                        <input type="text" placeholder="Enter notification title" required>
                    </div>
                    <div class="form-group">
                        <label>Send To</label>
                        <select required>
                            <option value="">Select audience</option>
                            <option>All Users</option>
                            <option>Students</option>
                            <option>Tutors</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea placeholder="Write notification message" required></textarea>
                    </div>
                    <button class="btn" type="submit">Create Notification</button>
                    <p class="message"></p>
                </form>
            </div>

            <div class="card">
                <h2>Recent Notifications</h2>
                <div class="info-row"><span>Welcome Message</span><strong>Example notification</strong></div>
                <div class="info-row"><span>Platform Update</span><strong>Example notification</strong></div>
                <span class="demo-label">Example notifications only.</span>
            </div>
        </main>
    </div>
</div>
</body>
</html>
