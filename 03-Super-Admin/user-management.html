<!DOCTYPE html>
<html>
<head>
    <title>User Management - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>User Management</h1>
                <p>View and manage platform users.</p>
            </div>

            <div class="card">
                <img class="content-image" src="asset/user-management.png" alt="User management illustration">
                <h2>User List</h2>
                <input class="search-box" type="text" placeholder="Search users...">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>
                        </thead>
                        <tbody>
                            <tr><td>Demo Student</td><td>student@example.com</td><td>Student</td><td><span class="status approved">Active</span></td><td><a class="btn" href="user-details.html">View</a></td></tr>
                            <tr><td>Demo Tutor</td><td>tutor@example.com</td><td>Tutor</td><td><span class="status pending">Pending</span></td><td><a class="btn" href="user-details.html">View</a></td></tr>
                        </tbody>
                    </table>
                </div>
                <span class="demo-label">All displayed records are examples.</span>
            </div>
        </main>
    </div>
</div>
</body>
</html>
