<!DOCTYPE html>
<html>
<head>
    <title>Support Management - LearnMate</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/admin.js" defer></script>
</head>
<body>
<div class="admin-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-area">
        <div class="topbar" id="topbar"></div>
        <main class="content">
            <div class="page-heading">
                <h1>Support Management</h1>
                <p>Manage user support requests.</p>
            </div>

            <div class="card">
                <img class="content-image" src="asset/support-management.png" alt="Support management illustration">
                <h2>Support Tickets</h2>
                <input class="search-box" type="text" placeholder="Search support tickets...">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>Ticket ID</th><th>User</th><th>Subject</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>
                            <tr><td>TK-DEMO-001</td><td>Demo Student</td><td>Login assistance</td><td>Demo date</td><td><span class="status pending">Open</span></td><td><button class="btn" data-action="Open support ticket">View</button></td></tr>
                            <tr><td>TK-DEMO-002</td><td>Demo Tutor</td><td>Account question</td><td>Demo date</td><td><span class="status approved">Resolved</span></td><td><button class="btn" data-action="View resolved ticket">View</button></td></tr>
                        </tbody>
                    </table>
                </div>
                <span class="demo-label">Example support tickets.</span>
            </div>

            <div class="card">
                <h2>Reply to Support Request</h2>
                <form class="demo-form">
                    <div class="form-group">
                        <label>Ticket ID</label>
                        <input type="text" placeholder="Enter ticket ID" required>
                    </div>
                    <div class="form-group">
                        <label>Reply</label>
                        <textarea placeholder="Write your reply" required></textarea>
                    </div>
                    <button class="btn" type="submit">Send Reply</button>
                    <p class="message"></p>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
